version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: campus-lost-found-backend:latest
    container_name: campus-backend
    ports:
      - "8080:8080"
    networks:
      - campus-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: campus-lost-found-frontend:latest
    container_name: campus-frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - campus-network
    restart: unless-stopped

networks:
  campus-network:
    driver: bridge
